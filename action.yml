name: upstream-card
description: Render an SVG card of the pull requests you got merged into other people's projects, for your profile README.
author: JROtto5
branding:
  icon: git-merge
  color: green
inputs:
  user:
    description: GitHub login to summarize (defaults to the repository owner)
    default: ${{ github.repository_owner }}
  svg:
    description: Path of the SVG card to write
    default: upstream-card.svg
  theme:
    description: auto (follows the viewer's light/dark setting), dark or light
    default: auto
  top:
    description: Projects shown on the card
    default: "6"
  exclude:
    description: Comma-separated owners or owner/repo to leave out
    default: ""
  min-stars:
    description: Leave out projects with fewer stars
    default: "0"
  exclude-forks:
    description: "true to leave out projects that are themselves forks"
    default: "false"
  since:
    description: Only PRs merged on or after this date (YYYY-MM-DD, UTC)
    default: ""
  types:
    description: "What to count: merged, reviewed, or merged,reviewed (reviewed = PRs by others that you reviewed, in public repos you don't own)"
    default: merged
  readme:
    description: README to update between <!-- upstream-card:start --> and <!-- upstream-card:end --> (empty to skip)
    default: ""
  no-stars:
    description: "true to leave star counts off, so the card changes only when a merge does"
    default: "false"
  cache:
    description: "File that remembers what GitHub showed last time (restore it with actions/cache): when nothing changed, the run skips the full fetch and writes nothing. Empty to always do a full run."
    default: ""
  dry-run:
    description: "true to print what would change and write nothing"
    default: "false"
  token:
    description: Token for the GitHub API (only public data is read; the default Actions token works)
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        UC_USER: ${{ inputs.user }}
        UC_SVG: ${{ inputs.svg }}
        UC_THEME: ${{ inputs.theme }}
        UC_TOP: ${{ inputs.top }}
        UC_EXCLUDE: ${{ inputs.exclude }}
        UC_MIN_STARS: ${{ inputs.min-stars }}
        UC_EXCLUDE_FORKS: ${{ inputs.exclude-forks }}
        UC_SINCE: ${{ inputs.since }}
        UC_TYPES: ${{ inputs.types }}
        UC_README: ${{ inputs.readme }}
        UC_DRY: ${{ inputs.dry-run }}
        UC_CACHE: ${{ inputs.cache }}
        UC_NO_STARS: ${{ inputs.no-stars }}
        UC_BIN: ${{ github.action_path }}/bin/upstream-card.js
      run: |
        args=(--user "$UC_USER" --svg "$UC_SVG" --theme "$UC_THEME" --top "$UC_TOP" --min-stars "$UC_MIN_STARS" --types "$UC_TYPES")
        [ -n "$UC_EXCLUDE" ] && args+=(--exclude "$UC_EXCLUDE")
        [ -n "$UC_SINCE" ] && args+=(--since "$UC_SINCE")
        [ -n "$UC_README" ] && args+=(--readme "$UC_README")
        [ "$UC_EXCLUDE_FORKS" = "true" ] && args+=(--exclude-forks)
        [ -n "$UC_CACHE" ] && args+=(--cache "$UC_CACHE")
        [ "$UC_DRY" = "true" ] && args+=(--dry-run)
        [ "$UC_NO_STARS" = "true" ] && args+=(--no-stars)
        node "$UC_BIN" "${args[@]}"
